spring:
  datasource:
    url: jdbc:${DB_TYPE}://${HOSTNAME}:${PORT_NUMBER}/${DATABASE_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


  ai:
    ollama:
      embedding:
        options:
          model: nomic-embed-text
      base-url: http://localhost:11434

    openai:
      api-key: ${OPEN_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

    vectorstore:
      pgvector:
        initialize-schema: false

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration


jwt:
  secretKey: ${SECRET_KEY}